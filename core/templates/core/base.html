<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zabalaza Security - {% block title %}{% endblock %}</title>
  <style>
    :root {
      --bg:#0a0a0a;
      --surface:#0e0e10;
      --surface-2:#111114;
      --text:#f5f5f5;
      --muted:#c8c8c8;
      --red:#e11d2e;        /* accent */
      --red-600:#c11224;    /* hover */
      --border:#1a1a1a;
      --soft-border:#1f1f22;
      --shadow: 0 10px 30px rgba(0,0,0,.45);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell,
        Noto Sans, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 70% -10%, rgba(225,29,46,.08), transparent),
                  radial-gradient(900px 420px at -10% 0%, rgba(225,29,46,.05), transparent),
                  var(--bg);
      color: var(--text);
      line-height: 1.7;
      letter-spacing: 0.1px;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 28px; }

    /* Header */
    .site-header { position: sticky; top:0; z-index:20; background: rgba(10,10,10,.85); backdrop-filter: blur(6px); border-bottom:1px solid var(--border); }
    .header-inner { display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:700; letter-spacing:.3px; }
    .brand .logo { width:36px; height:36px; border-radius:8px; background: linear-gradient(135deg, var(--red), #ff3647); display:inline-flex; align-items:center; justify-content:center; color:white; font-weight:800; box-shadow: 0 6px 18px rgba(225,29,46,.35); }

    /* Nav */
    nav { display:flex; gap:12px; flex-wrap:wrap; }
    nav a { color: var(--text); text-decoration: none; padding: 10px 12px; border-radius: 8px; border:1px solid transparent; position: relative; }
    nav a:after { content:""; position:absolute; left:12px; right:12px; bottom:6px; height:2px; background: linear-gradient(90deg, transparent, var(--red), transparent); transform: scaleX(0); transform-origin: center; transition: transform .2s ease; }
    nav a:hover { color: var(--text); }
    nav a:hover:after { transform: scaleX(1); }

    /* Layout */
    .hero { padding: 44px 0 20px; }
    .title { font-size: clamp(28px, 4vw, 42px); line-height:1.15; margin:0; letter-spacing:.2px; }
    .muted { color: var(--muted); }
    .eyebrow { color: var(--red); text-transform: uppercase; font-size: 12px; letter-spacing: .16em; font-weight: 700; }

    .card { background: linear-gradient(180deg, var(--surface), var(--surface-2)); border:1px solid var(--soft-border); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); }
    .card.inset { box-shadow: inset 0 1px rgba(255,255,255,.04), var(--shadow); }
    .grid { display:grid; gap:18px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

    .footer { margin-top: 36px; padding: 18px 0; color: var(--muted); font-size: 14px; border-top:1px solid var(--border); }

    /* Buttons */
    .btn { display:inline-block; padding:11px 16px; border-radius:10px; color:white; text-decoration:none; background: linear-gradient(180deg, var(--red), var(--red-600)); border:1px solid var(--red-600); box-shadow: 0 8px 20px rgba(225,29,46,.28); transition: transform .12s ease, box-shadow .2s ease; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(225,29,46,.34); }
    .btn.ghost { background: transparent; color: var(--text); border:1px solid var(--soft-border); }
    .btn.ghost:hover { border-color: var(--red); color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      nav a:after, .btn { transition: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="logo">Z</span>
        <span>Zabalaza Security</span>
      </div>
      <nav>
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/services/">Services</a>
        <a href="/clients/">Clients</a>
        <a href="/careers/">Careers</a>
        <a href="/contact/">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <div class="container footer">
    © {% now "Y" %} Zabalaza Security. All rights reserved.
  </div>
</body>
</html>
